[package]
name = "octop-pet"
version = "0.2.3"
description = "Desktop companion for a remote Octop instance"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "octop_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "4.1.6"
tauri-plugin-http = "2"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
tokio = { version = "1.53.1", features = ["rt", "net", "time", "io-util"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_RemoteDesktop", "Win32_System_Console"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSAnimation",
    "NSAnimationContext",
    "NSColor",
    "NSWindow",
    "objc2-quartz-core",
] }
objc2-quartz-core = { version = "0.3", features = ["CAMediaTimingFunction"] }
